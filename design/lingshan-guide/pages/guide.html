/* ============================================================
 * 灵山胜境AI数字人导览系统 - Brand Colors & Typography
 * ============================================================ */

:root {
  /* ---- Primary: 金色系 (Gold) ---- */
  --color-primary-100: #F5EDD6;
  --color-primary-200: #EBDCB0;
  --color-primary-300: #DFC98A;
  --color-primary-400: #D4B96E;
  --color-primary-500: #C5A55A;
  --color-primary-600: #A88B3E;
  --color-primary-700: #8A7130;
  --color-primary-800: #6C5724;
  --color-primary-900: #503F1A;

  /* ---- Secondary: 藏青 / 深蓝 (Deep Blue) ---- */
  --color-secondary-100: #C5CEE0;
  --color-secondary-200: #96A6C4;
  --color-secondary-300: #677EA8;
  --color-secondary-400: #3D5678;
  --color-secondary-500: #1B2A4A;
  --color-secondary-600: #152240;
  --color-secondary-700: #101A33;
  --color-secondary-800: #0A1226;
  --color-secondary-900: #050A19;

  /* ---- Neutral: 白 / 灰 ---- */
  --color-neutral-0:   #FFFFFF;
  --color-neutral-50:  #FAFAF5;
  --color-neutral-100: #F5F5F0;
  --color-neutral-200: #E5E5DD;
  --color-neutral-300: #D0D0C5;
  --color-neutral-400: #A3A395;
  --color-neutral-500: #767665;
  --color-neutral-600: #595948;
  --color-neutral-700: #3D3D31;
  --color-neutral-800: #222218;
  --color-neutral-900: #0F0F0A;

  /* ---- Accent: 朱砂红 (Vermilion) ---- */
  --color-accent-100: #F2D1D0;
  --color-accent-200: #E8A3A1;
  --color-accent-300: #DE7573;
  --color-accent-400: #D46462;
  --color-accent-500: #C25450;
  --color-accent-600: #A34340;
  --color-accent-700: #843330;
  --color-accent-800: #652320;
  --color-accent-900: #461312;

  /* ---- Semantic Tokens ---- */
  --color-bg-primary:     var(--color-neutral-0);
  --color-bg-secondary:   var(--color-neutral-100);
  --color-bg-deep:        var(--color-secondary-500);
  --color-bg-card:        var(--color-neutral-0);
  --color-bg-overlay:     rgba(27, 42, 74, 0.65);

  --color-text-primary:   var(--color-secondary-500);
  --color-text-secondary: var(--color-neutral-700);
  --color-text-inverse:   var(--color-neutral-0);
  --color-text-accent:    var(--color-accent-500);
  --color-text-gold:       var(--color-primary-500);

  --color-border-default: var(--color-neutral-200);
  --color-border-gold:     var(--color-primary-400);
  --color-border-subtle:   var(--color-neutral-100);

  /* ---- Typography ---- */
  --font-family-heading: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-family-body:    'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  --font-size-xs:   0.6875rem;
  --font-size-sm:   0.75rem;
  --font-size-base: 0.875rem;
  --font-size-md:   1rem;
  --font-size-lg:   1.125rem;
  --font-size-xl:   1.25rem;
  --font-size-2xl:  1.5rem;
  --font-size-3xl:  1.875rem;
  --font-size-4xl:  2.25rem;

  --font-weight-regular: 400;
  --font-weight-medium:  500;
  --font-weight-semibold: 600;
  --font-weight-bold:    700;

  --line-height-tight:   1.25;
  --line-height-normal:  1.6;
  --line-height-relaxed: 1.8;

  --letter-spacing-tight:  -0.02em;
  --letter-spacing-normal:  0;
  --letter-spacing-wide:    0.05em;
  --letter-spacing-wider:   0.1em;

  --space-0:   0;
  --space-1:   0.25rem;
  --space-2:   0.5rem;
  --space-3:   0.75rem;
  --space-4:   1rem;
  --space-5:   1.25rem;
  --space-6:   1.5rem;
  --space-8:   2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;

  --radius-sm:   4px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-full: 9999px;

  --shadow-sm:  0 1px 2px rgba(27, 42, 74, 0.06);
  --shadow-md:  0 4px 8px rgba(27, 42, 74, 0.08);
  --shadow-lg:  0 8px 24px rgba(27, 42, 74, 0.12);
  --shadow-xl:  0 16px 48px rgba(27, 42, 74, 0.16);
  --shadow-gold: 0 4px 16px rgba(197, 165, 90, 0.25);

  --transition-fast:   150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow:   400ms ease;

  --z-base:     0;
  --z-above:    10;
  --z-dropdown: 100;
  --z-sticky:   200;
  --z-overlay:  300;
  --z-modal:    400;
  --z-toast:    500;
}

body {
  font-family: var(--font-family-body);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-regular);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background-color: var(--color-bg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-family-heading);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-tight);
  color: var(--color-text-primary);
}

    <style type="text/tailwindcss">
  @layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ---- Page Layout ---- */
      body {
        overflow: hidden;
        height: 100dvh;
      }

      /* ---- Chat bubble animations ---- */
      @keyframes fade-slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .chat-bubble-animate {
        animation: fade-slide-up 0.4s ease-out forwards;
      }

      /* Quick question hover */
      .quick-question {
        transition: all var(--transition-normal);
        cursor: pointer;
      }
      .quick-question:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold);
      }

      /* Voice button pulse */
      @keyframes voice-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(197, 165, 90, 0.4); }
        50% { box-shadow: 0 0 0 8px rgba(197, 165, 90, 0); }
      }
      .voice-btn-pulse {
        animation: voice-pulse 2s ease-in-out infinite;
      }

      /* Online status dot */
      @keyframes online-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .online-dot {
        animation: online-pulse 2s ease-in-out infinite;
      }

      /* ---- 3D Mascot (桌宠) Styles ---- */
      #ai-mascot {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 500;
        cursor: grab;
        user-select: none;
        touch-action: none;
        filter: drop-shadow(0 4px 20px rgba(197, 165, 90, 0.5));
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      #ai-mascot.dragging {
        cursor: grabbing;
        transition: none;
        transform: scale(0.95);
      }
      #ai-mascot.dragging #mascot-speech-bubble {
        opacity: 0;
      }

      #threejs-container {
        width: 140px;
        height: 180px;
        position: relative;
        border-radius: 0;
        overflow: hidden;
      }
      #threejs-container canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Mascot golden glow ring */
      @keyframes breathe-glow {
        0%, 100% {
          box-shadow:
            0 0 20px rgba(197, 165, 90, 0.4),
            0 0 40px rgba(197, 165, 90, 0.2),
            0 0 60px rgba(197, 165, 90, 0.1),
            inset 0 0 15px rgba(197, 165, 90, 0.15);
        }
        50% {
          box-shadow:
            0 0 30px rgba(197, 165, 90, 0.6),
            0 0 60px rgba(197, 165, 90, 0.35),
            0 0 90px rgba(197, 165, 90, 0.15),
            inset 0 0 20px rgba(197, 165, 90, 0.25);
        }
      }
      .mascot-ring {
        animation: breathe-glow 3s ease-in-out infinite;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--color-primary-300), var(--color-primary-600), var(--color-primary-300));
      }

      /* Mascot label */
      #mascot-label {
        text-align: center;
        font-family: var(--font-family-heading);
        font-size: var(--font-size-sm);
        color: var(--color-primary-300);
        letter-spacing: var(--letter-spacing-wider);
        margin-top: 8px;
        text-shadow: 0 0 10px rgba(197, 165, 90, 0.5);
        font-weight: var(--font-weight-semibold);
      }

      /* Mascot speech bubble */
      #mascot-speech-bubble {
        display: none;
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--color-secondary-700);
        border: 1px solid rgba(197, 165, 90, 0.3);
        color: var(--color-primary-200);
        padding: 6px 14px;
        border-radius: var(--radius-lg);
        font-size: var(--font-size-xs);
        white-space: nowrap;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: var(--shadow-lg);
        z-index: 510;
        transition: opacity 0.3s ease;
      }
      #mascot-speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid var(--color-secondary-700);
      }

      /* Expression overlay on 3D */
      .expr-default { display: block; }
      .expr-thinking { display: none; }
      .expr-speaking { display: none; }

      .state-thinking .expr-default { display: none; }
      .state-thinking .expr-thinking { display: block; }
      .state-thinking .expr-speaking { display: none; }

      .state-speaking .expr-default { display: none; }
      .state-speaking .expr-thinking { display: none; }
      .state-speaking .expr-speaking { display: block; }

      /* Thinking dots animation */
      @keyframes dot-bounce {
        0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
      .thinking-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-primary-400);
        margin: 0 2px;
      }
      .thinking-dot:nth-child(1) { animation: dot-bounce 1.2s infinite 0s; }
      .thinking-dot:nth-child(2) { animation: dot-bounce 1.2s infinite 0.2s; }
      .thinking-dot:nth-child(3) { animation: dot-bounce 1.2s infinite 0.4s; }

      /* Speaking mouth animation */
      @keyframes mouth-move {
        0%, 100% { rx: 5; ry: 3; }
        25% { rx: 4; ry: 6; }
        50% { rx: 6; ry: 4; }
        75% { rx: 4; ry: 5; }
      }
      .speaking-mouth {
        animation: mouth-move 0.6s ease-in-out infinite;
      }

      /* TTS toggle button */
      .tts-toggle {
        transition: all var(--transition-fast);
      }
      .tts-toggle.active {
        color: var(--color-primary-300) !important;
      }
      .tts-toggle:not(.active) {
        color: var(--color-secondary-400) !important;
      }

      /* Background decorative particles */
      @keyframes bg-float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.06; }
        50% { transform: translateY(-20px) rotate(180deg); opacity: 0.12; }
      }
      .bg-particle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--color-primary-400);
        pointer-events: none;
        animation: bg-float 6s ease-in-out infinite;
      }
    </style>
</head>

        // 2. 景点名称精确匹配（遍历所有景点名称和别名）
        var matchedSpot = null;
        var spotKeys = Object.keys(spotsData);
        for (var i = 0; i < spotKeys.length; i++) {

            for (var j = 0; j < spot.aliases.length; j++) {

        if (matchedSpot) {

        // 14. 通用模糊匹配

        var bestMatch = null;

    // 表情状态管理（桌宠表情反馈）

    var currentExpression = 'default';
    var expressionOverlay = null;

    function setExpression(state) {
        currentExpression = state;
        if (!expressionOverlay) {
            expressionOverlay = document.getElementById('expression-overlay');
        }
        if (!expressionOverlay) return;

        var container = document.getElementById('avatar-container');
        var bubble = document.getElementById('mascot-speech-bubble');
        if (state === 'default') {
            expressionOverlay.style.display = 'none';
            container.classList.remove('state-thinking', 'state-speaking');
            if (bubble) bubble.style.display = 'none';
        } else if (state === 'thinking') {
            expressionOverlay.style.display = 'flex';
            container.classList.add('state-thinking');
            container.classList.remove('state-speaking');
            if (bubble) {
                bubble.style.display = 'block';
                bubble.textContent = '思考中...';
            }
        } else if (state === 'speaking') {
            expressionOverlay.style.display = 'flex';
            container.classList.add('state-speaking');
            container.classList.remove('state-thinking');
            if (bubble) {
                bubble.style.display = 'block';
                bubble.textContent = '讲解中...';
            }
        }
    }

    // ========================================================
    // 女声TTS 语音播放
    // ========================================================
    var ttsEnabled = true;

    function speakText(text) {
        if (!ttsEnabled) return;
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        var cleanText = text.replace(/<[^>]*>/g, '').replace(/【/g, '').replace(/】/g, '').replace(/\n+/g, '。');
        var utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.pitch = 1.2;

        // 尝试选择温柔女声
        var voices = window.speechSynthesis.getVoices();
        var femaleVoice = null;

        for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang.indexOf('zh') !== -1 && voices[i].name.indexOf('Female') !== -1) {
                femaleVoice = voices[i];
                break;
            }
        }
        if (!femaleVoice) {
            for (var i = 0; i < voices.length; i++) {
                if (voices[i].lang === 'zh-CN' && voices[i].name) {
                    if (voices[i].name.indexOf('Xiaoxiao') !== -1 || voices[i].name.indexOf('Huihui') !== -1 || voices[i].name.indexOf('Xiaoyi') !== -1 || voices[i].name.indexOf('晓晓') !== -1 || voices[i].name.indexOf('慧慧') !== -1) {
                        femaleVoice = voices[i];
                        break;
                    }
                }
            }
        }
        if (!femaleVoice) {
            for (var i = 0; i < voices.length; i++) {
                if (voices[i].lang.indexOf('zh') !== -1) {
                    femaleVoice = voices[i];
                    break;
                }
            }
        }
        if (femaleVoice) utterance.voice = femaleVoice;

        utterance.onend = function() {
            setExpression('default');
        };
        utterance.onerror = function() {
            setExpression('default');
        };
        window.speechSynthesis.speak(utterance);
    }

        // ========================================================
        // 3D模型旋转交互（滚轮旋转，拖动由桌宠逻辑处理位置）
        // ========================================================
        var userRotationY = 0;
        var userRotationX = 0;
        var userScale = 1.0;

        // 滚轮上下：旋转模型
        renderer.domElement.addEventListener('wheel', function(e) {
            e.preventDefault();
            userRotationY += e.deltaY * 0.003;
            e.stopPropagation();
        }, { passive: false });

        // Shift+滚轮：倾斜模型
        renderer.domElement.addEventListener('wheel', function(e) {
            if (e.shiftKey) {
                userRotationX += e.deltaY * 0.002;
                userRotationX = Math.max(-0.8, Math.min(0.8, userRotationX));
            }
        }, { passive: true });

        // 双指缩放（移动端）
        var lastPinchDist = 0;
        renderer.domElement.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.sqrt(dx * dx + dy * dy);
                e.stopPropagation();
            }
        }, { passive: true });
        renderer.domElement.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (lastPinchDist > 0) {
                    userScale *= dist / lastPinchDist;
                    userScale = Math.max(0.5, Math.min(2.0, userScale));
                }
                lastPinchDist = dist;
                e.stopPropagation();
                e.preventDefault();
            }
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', function() { lastPinchDist = 0; }, { passive: true });

            handGeo.position.set(-0.58, 0.65, 0.05);
            fallbackGroup.add(handGeo);
            var handGeo2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), skinMat);
            handGeo2.position.set(0.58, 0.65, 0.05);
            fallbackGroup.add(handGeo2);

            // 鞋子
            var shoeGeo = new THREE.SphereGeometry(0.08, 16, 16);
            shoeGeo.scale(1.2, 0.5, 1.4);
            var leftShoe = new THREE.Mesh(shoeGeo, new THREE.MeshPhongMaterial({ color: 0x2a2a3e }));
            leftShoe.position.set(-0.15, -0.15, 0.05);
            fallbackGroup.add(leftShoe);
            var rightShoe = new THREE.Mesh(shoeGeo.clone(), new THREE.MeshPhongMaterial({ color: 0x2a2a3e }));
            rightShoe.position.set(0.15, -0.15, 0.05);
            fallbackGroup.add(rightShoe);

            // 飘带
            var ribbonMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
            var ribbonGeo = new THREE.PlaneGeometry(0.04, 0.6);
            var ribbon1 = new THREE.Mesh(ribbonGeo, ribbonMat);
            ribbon1.position.set(-0.2, 0.2, 0.35);
            fallbackGroup.add(ribbon1);
            var ribbon2 = new THREE.Mesh(ribbonGeo, ribbonMat);
            ribbon2.position.set(0.2, 0.2, 0.35);
            fallbackGroup.add(ribbon2);

            // 莲花座
            var petalGroup = new THREE.Group();
            for (var i = 0; i < 10; i++) {
                var angle = (i / 10) * Math.PI * 2;
                var petalGeo = new THREE.SphereGeometry(0.15, 8, 8);
                petalGeo.scale(1, 0.15, 0.5);
                var petalMat = new THREE.MeshPhongMaterial({ color: 0xFFD700, shininess: 100, transparent: true, opacity: 0.6 });
                var petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.set(Math.cos(angle) * 0.25, 0, Math.sin(angle) * 0.25);
                petal.rotation.y = -angle;
                petalGroup.add(petal);
            }
            petalGroup.position.y = -0.25;
            fallbackGroup.add(petalGroup);

            // 光环
            var haloGeo = new THREE.RingGeometry(0.5, 0.55, 64);
            var haloMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
            var halo = new THREE.Mesh(haloGeo, haloMat);
            halo.position.set(0, 1.5, -0.2);
            fallbackGroup.add(halo);

            // 粒子
            var pCount = 60;
            var pGeo = new THREE.BufferGeometry();
            var pPos = new Float32Array(pCount * 3);
            for (var i = 0; i < pCount; i++) {
                var a = (i / pCount) * Math.PI * 2;
                var r = 0.8 + Math.random() * 0.5;
                pPos[i*3] = Math.cos(a) * r;
                pPos[i*3+1] = (Math.random() - 0.3) * 2.5;
                pPos[i*3+2] = Math.sin(a) * r * 0.3;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            var pMat = new THREE.PointsMaterial({ color: 0xFFD700, size: 0.03, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
            var particles = new THREE.Points(pGeo, pMat);
            fallbackGroup.add(particles);

            fallbackGroup.scale.set(0.9, 0.9, 0.9);
            group.add(fallbackGroup);

            // === 共享的底部装饰（无论加载成功与否都显示） ===
            var baseRingGeo = new THREE.TorusGeometry(0.8, 0.02, 8, 64);
            var baseRing = new THREE.Mesh(baseRingGeo, new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.5 }));
            baseRing.rotation.x = Math.PI / 2;
            baseRing.position.y = -0.6;
            group.add(baseRing);

            group.scale.set(0.8, 0.8, 0.8);
            group.position.y = 0.1;

            return {
                group: group,
                fallbackGroup: fallbackGroup,
                head: head,
                mouth: mouth,
                petalGroup: petalGroup,
                halo: halo,
                particles: particles,
                ribbon1: ribbon1,
                ribbon2: ribbon2,
                baseRing: baseRing,
                leftSleeve: leftSleeve,
                rightSleeve: rightSleeve,
                bun: bun
            };
        }

        var mascot = createMascotCharacter();
        scene.add(mascot.group);

        var mascotTime = 0;
        var currentExpression = 'idle';

        function setExpression(state) { currentExpression = state; }
        window.setExpression = setExpression;
        window.triggerSpeakPulse = function() { mascotTime = 0; };
        window.stopSpeakPulse = function() {
            if (currentExpression === 'speaking') currentExpression = 'idle';
        };
        window.triggerThinkAnim = function() {
            currentExpression = 'thinking';
            mascotTime = 0;
        };
        window.stopThinkAnim = function() {
            if (currentExpression === 'thinking') currentExpression = 'idle';
        };

        renderer.setAnimationLoop(function(delta) {
            mascotTime += (delta || 0.016);
            if (!mascot) return;

            // 更新骨骼动画（如果模型加载成功）
            if (window._mascotMixer) {
                window._mascotMixer.update(delta || 0.016);
            }

            // 使用用户拖动的旋转角度
            mascot.group.rotation.y = userRotationY;
            mascot.group.rotation.x = userRotationX;
            mascot.group.position.y = 0;
            mascot.group.scale.set(0.8 * userScale, 0.8 * userScale, 0.8 * userScale);

            // 底座环不旋转
            mascot.baseRing.rotation.z = 0;

            // 莲花不旋转
            mascot.petalGroup.rotation.y = 0;

            // 光环不脉动
            if (mascot.halo) {
                mascot.halo.scale.set(1, 1, 1);
            }

            // 粒子不旋转
            mascot.particles.rotation.y = 0;

            // 降级几何体的动画（只有降级方案显示时才生效）
            if (mascot.fallbackGroup.visible) {
                // 手臂/袖子摆动
                mascot.leftSleeve.rotation.z = 0.5 + Math.sin(mascotTime * 1.0) * 0.15;
                mascot.rightSleeve.rotation.z = -0.5 - Math.sin(mascotTime * 1.0) * 0.15;
                // 飘带飘动
                mascot.ribbon1.rotation.z = Math.sin(mascotTime * 0.8) * 0.2;
                mascot.ribbon2.rotation.z = -Math.sin(mascotTime * 0.8) * 0.2;
                // 发髻微晃
                mascot.bun.position.x = Math.sin(mascotTime * 0.6) * 0.02;

                // 表情
                if (currentExpression === 'speaking') {
                    mascot.mouth.scale.set(1 + Math.sin(mascotTime * 8) * 0.4, 1 + Math.sin(mascotTime * 8) * 0.4, 1);
                } else if (currentExpression === 'thinking') {
                    mascot.head.rotation.z = Math.sin(mascotTime * 0.8) * 0.1;
                } else {
                    mascot.mouth.scale.set(1, 1, 1);
                    mascot.head.rotation.z = 0;
                }
            }

            // 说话状态不再旋转（保持用户手动旋转的角度）

            renderer.render(scene, camera);
        });
        } catch(e) {
            console.warn('[灵小仙] 3D桌宠初始化失败:', e.message, '。其他功能不受影响。');
            var container = document.getElementById('threejs-container');
            if (container) container.style.display = 'none';
        }
    })();

    // ========================================================
    // 桌宠拖动逻辑
    // ========================================================
    (function initDrag() {
        var mascot = document.getElementById('ai-mascot');
        if (!mascot) return;

        var isDragging = false;
        var dragOffset = { x: 0, y: 0 };

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startDrag(e) {
            isDragging = true;
            var pos = getEventPos(e);
            var rect = mascot.getBoundingClientRect();
            dragOffset.x = pos.x - rect.left;
            dragOffset.y = pos.y - rect.top;
            mascot.style.transition = 'none';
            mascot.classList.add('dragging');
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            var pos = getEventPos(e);
            mascot.style.left = (pos.x - dragOffset.x) + 'px';
            mascot.style.top = (pos.y - dragOffset.y) + 'px';
            mascot.style.right = 'auto';
            mascot.style.bottom = 'auto';
            mascot.style.transform = 'none';
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            mascot.classList.remove('dragging');
            mascot.style.cursor = 'grab';
            mascot.style.transition = 'all 0.3s ease';
        }

        mascot.addEventListener('mousedown', function(e) {
            e.preventDefault();
            startDrag(e);
        });
        mascot.addEventListener('touchstart', function(e) {
            startDrag(e);
        }, { passive: true });
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // 双击桌宠触发打招呼
        var lastTap = 0;
        mascot.addEventListener('dblclick', function() {
            askQuestion('你好，灵小仙！');
        });
        mascot.addEventListener('touchend', function(e) {
            var now = Date.now();
            if (now - lastTap < 300) {
                askQuestion('你好，灵小仙！');
            }
            lastTap = now;
        });
    })();

    // ========================================================
    // 消息发送与对话系统
    // ========================================================
    function createBotAvatarHTML() {
        return '<div class="flex-shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700)); box-shadow: 0 0 12px rgba(197, 165, 90, 0.3);">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="2" fill="#F5EDD6"/><circle cx="17" cy="8" r="2" fill="#F5EDD6"/><path d="M10 16 Q14 20 18 16" stroke="#F5EDD6" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>' +
            '</div>';
    }

    function createUserAvatarHTML() {
        return '<div class="flex-shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 50%; background: var(--color-secondary-600);">' +
            '<i data-lucide="user" style="width: 16px; height: 16px; color: var(--color-secondary-300);"></i>' +
            '</div>';
    }

    function addUserMessage(text) {
        var chatArea = document.getElementById('chatArea');
        var msg = document.createElement('div');
        msg.className = 'flex gap-2 justify-end chat-bubble-animate';
        msg.style.opacity = '0';
        msg.innerHTML = '<div class="flex flex-col max-w-[85%] items-end">' +
            '<span class="mb-1" style="font-size: var(--font-size-xs); color: var(--color-secondary-300);">您</span>' +
            '<div class="px-4 py-3 rounded-2xl rounded-tr-sm" style="background: linear-gradient(135deg, var(--color-primary-700), var(--color-primary-800)); color: var(--color-primary-100); font-size: var(--font-size-sm); line-height: var(--line-height-relaxed);">' +
            escapeHTML(text) +
            '</div></div>' +
            createUserAvatarHTML();
        chatArea.appendChild(msg);
        lucide.createIcons();
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addBotMessage(text) {
        var chatArea = document.getElementById('chatArea');
        
        // 检测地图标记 [MAP:path]
        var mapPath = '';
        var displayText = text;
        var mapMatch = text.match(/\[MAP:(.+?)\]/);
        if (mapMatch) {
            mapPath = mapMatch[1];
            displayText = text.replace(/\[MAP:.+?\]/, '').trim();
        }
        
        var msg = document.createElement('div');
        msg.className = 'flex gap-2 chat-bubble-animate';
        msg.style.opacity = '0';
        
        var contentHTML = escapeHTML(displayText);
        if (mapPath) {
            contentHTML += '<div style="margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(197, 165, 90, 0.2); cursor: pointer;" onclick="window.open(this.querySelector(\'img\').src, \'_blank\')">' +
                '<img src="' + mapPath + '" alt="灵山胜境景区导览地图" style="width: 100%; display: block; border-radius: 11px;">' +
                '<div style="text-align: center; padding: 6px 0; font-size: 12px; color: var(--color-primary-400); background: rgba(197, 165, 90, 0.05);">点击查看大图</div>' +
                '</div>';
        }
        
        msg.innerHTML = createBotAvatarHTML() +
            '<div class="flex flex-col max-w-[85%]">' +
            '<span class="mb-1" style="font-size: var(--font-size-xs); color: var(--color-primary-400); font-weight: var(--font-weight-medium);">灵小仙</span>' +
            '<div class="px-4 py-3 rounded-2xl rounded-tl-sm" style="background: var(--color-secondary-700); border: 1px solid rgba(197, 165, 90, 0.1); color: var(--color-neutral-100); font-size: var(--font-size-sm); line-height: var(--line-height-relaxed); white-space: pre-wrap;">' +
            contentHTML +
            '</div></div>';
        chatArea.appendChild(msg);
        lucide.createIcons();
        chatArea.scrollTop = chatArea.scrollHeight;

        // 语音播放
        speakText(displayText);

        // 触发3D动画
        setExpression('speaking');
        if (window.triggerSpeakPulse) {
            window.triggerSpeakPulse();
            if (window.stopThinkAnim) window.stopThinkAnim();
            var estimatedDuration = Math.min(displayText.length * 0.2, 60) * 1000;
            setTimeout(function() {
                if (window.stopSpeakPulse) window.stopSpeakPulse();
                setExpression('default');
            }, estimatedDuration);
        }
    }

    function escapeHTML(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function askQuestion(text) {
        var input = document.getElementById('chatInput');
        if (input) input.value = text;
        sendMessage();
    }

    function sendMessage() {
        var input = document.getElementById('chatInput');
        var text = input ? input.value.trim() : '';
        if (!text) return;

        addUserMessage(text);
        input.value = '';

        // 显示思考状态
        setExpression('thinking');
        if (window.triggerThinkAnim) {
            window.triggerThinkAnim();
        }

        // 更新桌宠气泡显示用户问题片段
        var bubble = document.getElementById('mascot-speech-bubble');
        if (bubble) {
            var shortText = text.length > 15 ? text.substring(0, 15) + '...' : text;
            bubble.textContent = shortText;
        }

        // 模拟思考延迟后回复
        setTimeout(function() {
            var answer = findAnswer(text);
            if (window.stopThinkAnim) window.stopThinkAnim();

            // 短暂延迟后显示回复
            setTimeout(function() {
                addBotMessage(answer);
            }, 200);
        }, 800 + Math.random() * 600);
    }

    // 绑定发送按钮
    var sendBtn = document.getElementById('sendBtn');
    if (sendBtn) {
        sendBtn.addEventListener('click', function() { sendMessage(); });
    }

    // 回车发送
    var chatInput = document.getElementById('chatInput');
    if (chatInput) {
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
    }

    // 自动滚动到底部，并确保初始消息可见
    window.addEventListener('load', function() {
        var chatArea = document.getElementById('chatArea');
        if (chatArea) {
            setTimeout(function() {
                var bubbles = chatArea.querySelectorAll('.chat-bubble-animate');
                bubbles.forEach(function(b) {
                    if (b.style.opacity === '0') {
                        b.style.opacity = '1';
                    }
                });
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 600);
        }
    });

    // ========================================================
    // 语音识别（Web Speech API）
    // ========================================================
    var voiceBtn = document.getElementById('voice-input-btn');
    var recognition = null;
    if (voiceBtn && ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {
            voiceBtn.innerHTML = '<span style="font-size:12px;color:var(--color-primary-100);">聆听中...</span>';
            voiceBtn.style.animation = 'voice-pulse 1s infinite';
            voiceBtn.style.background = 'linear-gradient(135deg, var(--color-accent-500), var(--color-accent-600))';
        };

        recognition.onresult = function(event) {
            var transcript = '';
            for (var i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            var input = document.getElementById('chatInput');
            if (input) {
                input.value = transcript;
                input.focus();
            }
        };

        recognition.onend = function() {
            voiceBtn.innerHTML = '';
            var icon = document.createElement('i');
            icon.setAttribute('data-lucide', 'mic');
            icon.style.width = '18px';
            icon.style.height = '18px';
            voiceBtn.appendChild(icon);
            lucide.createIcons();
            voiceBtn.style.animation = '';
            voiceBtn.style.background = 'linear-gradient(135deg, var(--color-primary-500), var(--color-primary-600))';
            var input = document.getElementById('chatInput');
            if (input && input.value.trim()) {
                setTimeout(function() { sendMessage(); }, 300);
            }
        };

        recognition.onerror = function(event) {
            if (event.error === 'not-allowed') {
                alert('请允许浏览器使用麦克风权限');
            }
            recognition.onend();
        };

        voiceBtn.addEventListener('click', function() {
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }
        });
    } else if (voiceBtn) {
        voiceBtn.addEventListener('click', function() {
            alert('您的浏览器不支持语音识别功能，请使用Chrome浏览器或手动输入问题。');
        });
    }
    </script>
