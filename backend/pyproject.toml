[project]
name = "scenic-ai-guide-backend"
version = "0.1.0"
description = "景区导览服务AI数字人后端"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "chromadb>=0.5.23",
  "edge-tts>=7.0.0",
  "fastapi[standard]>=0.115.6",
  "faster-whisper>=1.1.1",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
]

[tool.ruff]
line-length = 100
target-version = "py311"
