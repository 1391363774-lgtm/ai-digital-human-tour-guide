name: Offline regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GUIDE_NO_ENV_FILE: '1'
      LLM_API_KEY: ''
      LLM_FALLBACK_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pytest tests/backend -q --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}
          path: test-results/
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lingshan-ci .
      - run: docker run -d --rm --name lingshan-ci -p 127.0.0.1:8080:8080 lingshan-ci
      - run: python scripts/smoke_demo.py
      - if: always()
        run: docker logs lingshan-ci
      - if: always()
        run: docker stop lingshan-ci
