services:
  postgres:
    image: postgres:16-alpine
    container_name: scenic-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenic_ai_guide}
      POSTGRES_USER: ${POSTGRES_USER:-scenic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenic_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenic_user} -d ${POSTGRES_DB:-scenic_ai_guide}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenic-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scenic_user}:${POSTGRES_PASSWORD:-scenic_password}@postgres:5432/${POSTGRES_DB:-scenic_ai_guide}
      CHROMA_PERSIST_DIR: /app/data/vector_store/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scenic-ai-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
