services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      GUIDE_NO_ENV_FILE: '1'
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      DATABASE_URL: sqlite+aiosqlite:////runtime/guide.sqlite3
      TTS_CACHE_DIR: /runtime/tts
      VECTOR_CACHE: /runtime/vectors.npz
    volumes:
      - guide-runtime:/runtime
    restart: unless-stopped
volumes:
  guide-runtime:
