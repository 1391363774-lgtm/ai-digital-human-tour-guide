version: '3.8'
# ============================================================
# 灵山胜境AI数字人导览系统 - 生产环境可选编排
# 说明:默认交付形态为单exe/单进程一体化(无需Docker)。
# 本文件用于可选的生产部署:FastAPI多worker + MySQL + Nginx。
# 向量检索默认内置numpy引擎(无需Milvus);如需Milvus可自行扩展。
# ============================================================
services:
  app:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # 生产环境使用MySQL(与下方mysql服务联动);注释掉则回退SQLite
      - DATABASE_URL=mysql+aiomysql://root:REDACTED_SET_LOCALLY@mysql:3306/lingshan_guide
    volumes:
      - ./backend:/app
      - ./design:/app/../design
      - ./知识库:/app/../知识库
    depends_on:
      - mysql
    restart: always
    command: >
      sh -c "pip install aiomysql &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a unique local secret}
      MYSQL_DATABASE: lingshan_guide
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:8080"
    depends_on:
      - app
    restart: always

volumes:
  mysql_data:
