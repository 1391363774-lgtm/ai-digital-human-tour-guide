<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Live2D Test</title>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
</head>
<body style="margin:0;background:#111827;color:#fff;font-family:sans-serif;">
  <canvas id="canvas" width="800" height="800" style="border:1px solid red"></canvas>
  <script>
    (async () => {
      try {
        const app = new PIXI.Application({
          view: document.getElementById('canvas'),
          backgroundAlpha: 0,
          width: 800,
          height: 800,
          antialias: true,
        })
        const model = await PIXI.live2d.Live2DModel.from('/models/haru/Haru.model3.json', {
          autoInteract: false,
          idleMotionGroup: 'Idle',
        })
        model.anchor.set(0.5, 0.4)
        model.x = 400
        model.y = 390
        const scale = Math.min(app.screen.width / model.width, app.screen.height / model.height) * 0.72
        model.scale.set(scale)
        app.stage.addChild(model)
        console.log('SUCCESS: Live2D model loaded', model)
      } catch (error) {
        console.error('FAILED: Live2D model load error', error)
      }
    })()
  </script>
</body>
</html>
